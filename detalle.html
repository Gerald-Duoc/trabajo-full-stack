<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle | Chascone Café</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="estilos/estilos.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar nav-con-fondo">
    <div class="container">
      <a class="navbar-brand" href="index.html">Chascone Café</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="sobre-nosotros.html">Sobre nosotros</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          <li class="nav-item"><a class="nav-link" href="carrito.html">Carrito</a></li>
          <li class="nav-item" id="menuSesion"></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container" id="contenidoDetalle">
    <p class="text-muted">Cargando producto...</p>
  </main>
  <footer class="text-white text-center py-3">
    <div class="container">
      <small>&copy; 2026 Chascone Café. Todos los derechos reservados.</small>
    </div>
  </footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="usuarios.js"></script>
  <script src="productos.js"></script>
  <script src="carrito.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const idProducto = params.get('id');
    const producto = PRODUCTOS.find(function (p) { return p.id === idProducto; });
    const contenedor = document.getElementById('contenidoDetalle');

    if (!producto) {
      contenedor.innerHTML =
        '<div class="text-center py-5"><h1>Producto no encontrado</h1>' +
        '<p class="text-muted">El producto que buscas no existe.</p>' +
        '<a href="productos.html" class="btn btn-primary">Volver a productos</a></div>';
    } else {
      const enStock = Number(producto.stock) > 0;
      const estadoStock = enStock
        ? '<span class="badge bg-success">Disponible - Stock: ' + producto.stock + '</span>'
        : '<span class="badge bg-danger">Agotado</span>';

      contenedor.innerHTML =
        '<a href="productos.html" class="btn btn-outline-secondary mb-4">← Volver a productos</a>' +
        '<div class="card card-body border-0 shadow-sm">' +
        '<div class="row g-4 align-items-center">' +
        '<div class="col-md-5"><img src="' + producto.img + '" alt="' + producto.nombre + '" class="img-fluid rounded-3" style="max-height:400px;object-fit:cover;width:100%;"></div>' +
        '<div class="col-md-7">' +
        '<span class="badge bg-secondary mb-2">' + producto.categoria + '</span>' +
        '<h1 class="mb-2">' + producto.nombre + '</h1>' +
        '<h3 class="text-success mb-3">$' + producto.precio.toLocaleString('es-CL') + '</h3>' +
        '<p class="mb-3">' + producto.descripcion + '</p>' +
        '<p class="mb-3">' + estadoStock + '</p>' +
        '<button class="btn btn-primary btn-lg" ' + (enStock ? '' : 'disabled') + ' onclick="agregarAlCarrito(\'' + producto.id + '\')">Añadir al carrito</button>' +
        '</div></div></div>';
    }
  </script>
</body>
</html>
