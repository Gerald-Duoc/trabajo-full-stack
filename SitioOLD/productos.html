<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos | Chascone Café</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="estilos/estilos.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar nav-con-fondo">
    <div class="container">
      <a class="navbar-brand" href="index.html">Chascone Café</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="sobre-nosotros.html">Sobre nosotros</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          <li class="nav-item">
            <a class="nav-link" href="carrito.html">
              Carrito <span id="badgeCarrito" class="badge bg-light text-dark" style="display:none;">0</span>
            </a>
          </li>
          <li class="nav-item" id="menuSesion"></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container">
    <h1 class="mb-4">Nuestros productos</h1>
    <p class="text-muted mb-4">
      Nuestras bebidas, utensilios y accesorios para preparar el mejor café.
    </p>
    <div class="row g-4" id="productosGrid"></div>
  </main>
  <footer class="text-white text-center py-3">
    <div class="container">
      <small>&copy; 2026 Chascone Café. Todos los derechos reservados.</small>
    </div>
  </footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="usuarios.js"></script>
  <script src="productos.js"></script>
  <script src="carrito.js"></script>
  <script>
    const grid = document.getElementById('productosGrid');
    PRODUCTOS.forEach(function (producto) {
      const col = document.createElement('div');
      col.className = 'col-sm-6 col-lg-4';
      col.innerHTML =
        '<div class="card h-100">' +
        '<div class="img-placeholder"><img src="' + producto.img + '" alt="' + producto.nombre + '" class="img-fluid"></div>' +
        '<div class="card-body d-flex flex-column">' +
        '<h5 class="card-title">' + producto.nombre + '</h5>' +
        '<p class="card-text text-muted">' + producto.descripcion + '</p>' +
        '<p class="fw-bold mb-3" style="font-size: 25px;">$' + producto.precio.toLocaleString('es-CL') + '</p>' +
        '<div class="d-flex gap-2 mt-auto">' +
        '<a class="btn btn-outline-primary flex-fill" href="detalle.html?id=' + producto.id + '">Ver detalle</a>' +
        '<button class="btn btn-primary flex-fill" onclick="agregarAlCarrito(\'' + producto.id + '\')">Añadir al carrito</button>' +
        '</div>' +
        '</div></div>';
      grid.appendChild(col);
    });
  </script>
</body>
</html>
